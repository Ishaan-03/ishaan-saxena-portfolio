name: ci

# Section 10 of the brief. Every push and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs, not tags. A tag can be moved to point
      # at different code; a SHA cannot. Same rule as the Gatekeeper pipeline.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gitleaks needs the whole history, not just the tip.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Translations
        run: npm run i18n:check

      - name: Audit production dependencies
        run: npm run audit:ci

      - name: Build
        run: npm run build
        env:
          # The build must not depend on real secrets. Turnstile is absent here
          # on purpose, so the contact route's fail-closed path is what ships.
          NEXT_PUBLIC_SITE_URL: https://ishaansaxena.vercel.app

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # gitleaks is called directly rather than through gitleaks-action.
      #
      # On a push the action scans only the pushed range, which it builds as
      # `<first>^..<last>`. The first push of a repository includes the root
      # commit, whose parent does not exist, so git failed with "ambiguous
      # argument", the action scanned ~0 bytes and still exited 1. This job
      # claims to scan the full history, so it now actually does: `gitleaks git`
      # with no range walks every commit on every run.
      #
      # Pinned by version and verified by sha256, the same discipline as the
      # SHA-pinned actions above.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the full history for secrets
        run: ./gitleaks git --redact --no-banner .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the browser Playwright needs
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npx playwright test --workers=2
